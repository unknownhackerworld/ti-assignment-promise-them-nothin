events {
    worker_connections 1024;
}

http {
    # Upstream configuration - 3 app nodes
    upstream relayapi_backend {
        # Round-robin load balancing (default)
        server app-node-1:3000;
        server app-node-2:3000;
        server app-node-3:3000;
    }

    # Access logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    server {
        listen 80;
        server_name localhost;

        # Proxy all requests to the backend
        location / {
            proxy_pass http://relayapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Preserve customer ID header
            proxy_pass_request_headers on;

            # Connection settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # Health check endpoint (direct to any node)
        location /health {
            proxy_pass http://relayapi_backend;
            access_log off;
        }
    }
}
